<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
    (function() {
      var t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '\\[', right: '\\]', display: true}, {left: '\\(', right: '\\)', display: false}]});"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="{{ '/' | relative_url }}" class="site-logo">
        <span class="logo-icon">&gt;_</span>
        <span class="logo-text">{{ site.title }}</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="https://github.com/ashababnoor/cheatsheets" target="_blank" rel="noopener">GitHub</a>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
          <i class="fa-solid fa-moon theme-icon-dark"></i>
          <i class="fa-solid fa-sun theme-icon-light"></i>
        </button>
      </nav>
    </div>
  </header>

  <main class="site-main">
    {% if page.layout == 'home' %}
      {{ content }}
    {% else %}
      <div class="page-layout">
        <article class="page-content">
          {{ content }}
        </article>
        <aside class="toc-sidebar" id="toc-sidebar">
          <div class="toc-header">On this page</div>
          <nav id="toc-nav"></nav>
        </aside>
      </div>
    {% endif %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; {{ site.time | date: '%Y' }} <a href="https://ashababnoor.github.io" target="_blank" rel="noopener">{{ site.author.name }}</a>. Built with Jekyll.</p>
    </div>
  </footer>

  {% unless page.layout == 'home' %}
  <script>
    (function() {
      const article = document.querySelector('.page-content');
      const tocNav = document.getElementById('toc-nav');
      const tocSidebar = document.getElementById('toc-sidebar');
      if (!article || !tocNav) return;

      const headings = article.querySelectorAll('h2, h3');
      if (headings.length < 2) {
        tocSidebar.style.display = 'none';
        document.querySelector('.page-layout').classList.add('no-toc');
        return;
      }

      const list = document.createElement('ul');
      headings.forEach(function(h, i) {
        if (!h.id) h.id = 'section-' + i;
        const li = document.createElement('li');
        li.className = h.tagName === 'H3' ? 'toc-h3' : 'toc-h2';
        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        li.appendChild(a);
        list.appendChild(li);
      });
      tocNav.appendChild(list);

      // Highlight active heading on scroll
      const links = tocNav.querySelectorAll('a');
      const observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            links.forEach(function(l) { l.classList.remove('active'); });
            const active = tocNav.querySelector('a[href="#' + entry.target.id + '"]');
            if (active) active.classList.add('active');
          }
        });
      }, { rootMargin: '0px 0px -70% 0px', threshold: 0 });

      headings.forEach(function(h) { observer.observe(h); });
    })();
  </script>
  {% endunless %}
  <script>
    (function() {
      var btn = document.getElementById('theme-toggle');
      btn.addEventListener('click', function() {
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    })();
  </script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    document.querySelectorAll('code.language-mermaid').forEach(function(code) {
      var pre = code.parentElement;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      pre.parentElement.replaceChild(div, pre);
    });
    var theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'default' : 'dark';
    mermaid.initialize({ startOnLoad: true, theme: theme });
  </script>
</body>
</html>
