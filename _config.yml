# Site settings
title: Cheatsheets
description: Concise, easy-to-reference cheatsheets for various programming languages and technologies
baseurl: /cheatsheets
author:
  name: Ahmed Shabab Noor
  email: ashababnoor@gmail.com

permalink: /404.md

collections:
  cheatsheets:
    output: true
    permalink: /:path

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "cheatsheets"
    values:
      layout: "default"


markdown: kramdown
kramdown:
  math_engine: null
