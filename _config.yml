# Site settings
title: Cheatsheets
description: Concise, easy-to-reference cheatsheets for various programming languages and technologies
baseurl: /cheatsheets
url: https://shababnoor.com
author:
  name: Ahmed Shabab Noor
  email: ashababnoor@gmail.com

permalink: /404.md

collections:
  cheatsheets:
    output: true
    permalink: /:path

# Category order on the homepage and the 404 page. A cheatsheet's `category` must match one of these.
cheatsheet_categories:
  - Tools & DevOps
  - Languages & Code
  - Web & Formats
  - Search
  - CS Fundamentals
  - Math & Science

# The github-pages gem defaults to jekyll-theme-primer, whose style.scss compiles to
# /assets/css/style.css and overwrites our own stylesheet on rebuilds. We ship our own layouts.
theme: null

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "cheatsheets"
    values:
      layout: "default"


markdown: kramdown
kramdown:
  math_engine: null
