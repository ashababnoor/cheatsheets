  <header class="site-header">
    <div class="header-inner">
      <a href="{{ '/' | relative_url }}" class="site-logo">
        <img src="{{ '/favicon.svg' | relative_url }}" class="logo-icon" alt="" width="28" height="28">
        <span class="logo-text">{{ site.title }}</span>
      </a>
      <nav class="site-nav">
        <button type="button" class="search-trigger" data-search-open aria-label="Search cheatsheets" aria-keyshortcuts="/ Control+K Meta+K"><span>Search</span><kbd>/</kbd></button>
        <a href="{{ '/' | relative_url }}" class="nav-home">Home</a>
        <a href="https://github.com/ashababnoor/cheatsheets" class="nav-github" target="_blank" rel="noopener" aria-label="GitHub repository">
          <span class="nav-github-text">GitHub</span>
          <svg class="nav-github-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        </a>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" data-tip="Toggle theme">
          <svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M20.55 14.8A9 9 0 1 1 9.2 3.45A8.5 8.5 0 0 0 20.55 14.8Z"/>
          </svg>
          <svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        </button>
        {% if page.layout != 'home' and page.toc != false %}
        <button type="button" class="toc-toggle" id="toc-toggle" aria-label="On this page" aria-expanded="false" aria-controls="toc-panel" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        {% endif %}
      </nav>
    </div>
  </header>
  {% if page.layout != 'home' and page.toc != false %}
  <nav class="toc-panel" id="toc-panel" aria-label="On this page" hidden>
    <div class="toc-header">On this page</div>
  </nav>
  <div class="toc-backdrop" id="toc-backdrop" hidden></div>
  {% endif %}
